name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to build from main
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: toolknit-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag and versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($env:DISPATCH_RELEASE_TAG) {
            $tag = $env:DISPATCH_RELEASE_TAG
          }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $tag"
          }
          $releaseVersion = $Matches.version

          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch main for release validation" }
          $releaseCommit = git rev-parse HEAD
          $tagCommit = git rev-parse --verify "refs/tags/${tag}^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $releaseCommit) {
            throw "Release checkout must match the existing tag $tag"
          }
          git merge-base --is-ancestor $releaseCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit contained in origin/main"
          }

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $packageLockVersion = (Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $cliVersion = (Get-Content cli/package.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $cliLockVersion = (Get-Content cli/npm-shrinkwrap.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoText -notmatch '(?m)^version = "(?<cargoVersion>\d+\.\d+\.\d+)"\r?$') {
            throw "Unable to read the desktop version from Cargo.toml"
          }
          $cargoVersion = $Matches.cargoVersion
          $cargoLockText = Get-Content src-tauri/Cargo.lock -Raw
          if ($cargoLockText -notmatch '(?ms)\[\[package\]\]\r?\nname = "toolknit-desktop"\r?\nversion = "(?<cargoLockVersion>\d+\.\d+\.\d+)"') {
            throw "Unable to read the desktop version from Cargo.lock"
          }

          $versions = [ordered]@{
            package = $packageVersion
            packageLock = $packageLockVersion
            cli = $cliVersion
            cliLock = $cliLockVersion
            tauri = $tauriVersion
            cargo = $cargoVersion
            cargoLock = $Matches.cargoLockVersion
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $releaseVersion) {
              throw "$($entry.Key) version $($entry.Value) does not match tag $tag"
            }
          }

          $settingsUi = Get-Content src/app/templates/settings.html -Raw
          $homeUi = Get-Content index.html -Raw
          $settingsPattern = 'id="settings-version"[^>]*>\s*v{0}\s*<' -f [regex]::Escape($releaseVersion)
          $sidebarPattern = 'id="sidebarVersion"[^>]*>\s*v{0}\s*<' -f [regex]::Escape($releaseVersion)
          if ($settingsUi -notmatch $settingsPattern -or $homeUi -notmatch $sidebarPattern) {
            throw "The desktop UI version labels do not match tag $tag"
          }

          $updateNotesPath = Join-Path $PWD "..\docs\desktop-update.md"
          if (-not (Test-Path -LiteralPath $updateNotesPath)) {
            throw "Missing docs/desktop-update.md release notes"
          }
          $updateNotes = Get-Content -LiteralPath $updateNotesPath -Raw
          $updateNotesHeading = "(?m)^# ToolKnit Desktop {0}\s*$" -f [regex]::Escape($releaseVersion)
          if ($updateNotes -notmatch $updateNotesHeading) {
            throw "docs/desktop-update.md must start with the release version $releaseVersion"
          }

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolknit-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-31

      - name: Install Rust security auditor
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        working-directory: toolknit-desktop/src-tauri
        # RUSTSEC-2024-0429 affects glib, which is only present in Tauri's
        # Linux dependency graph. ToolKnit's supported release target is Windows.
        run: cargo audit --target-os windows --target-arch x86_64 -D unsound -D yanked --ignore RUSTSEC-2024-0429

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare locked FFmpeg for native integration tests
        shell: pwsh
        run: |
          $ffmpegDirectory = Join-Path $PWD "src-tauri/resources/ffmpeg"
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP "ffmpeg-win32-x64.gz"
          $ffmpegExecutable = Join-Path $ffmpegDirectory "ffmpeg.exe"
          $ffmpegUrl = "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz"
          $expectedHash = "8883a3dffbd0a16cf4ef95206ea05283f78908dbfb118f73c83f4951dcc06d77"

          New-Item -ItemType Directory -Path $ffmpegDirectory -Force | Out-Null
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegArchive -MaximumRetryCount 3 -RetryIntervalSec 5

          $actualHash = (Get-FileHash -LiteralPath $ffmpegArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "FFmpeg archive integrity check failed: expected $expectedHash, got $actualHash"
          }

          $inputStream = [System.IO.File]::OpenRead($ffmpegArchive)
          try {
            $gzipStream = [System.IO.Compression.GZipStream]::new(
              $inputStream,
              [System.IO.Compression.CompressionMode]::Decompress
            )
            try {
              $outputStream = [System.IO.File]::Create($ffmpegExecutable)
              try {
                $gzipStream.CopyTo($outputStream)
              } finally {
                $outputStream.Dispose()
              }
            } finally {
              $gzipStream.Dispose()
            }
          } finally {
            $inputStream.Dispose()
          }

          & $ffmpegExecutable -version

      - name: Run complete release test suite
        run: npm run test:release

      - name: Run native tests
        working-directory: toolknit-desktop/src-tauri
        run: cargo test --locked

      - name: Build Tauri
        run: npm run tauri build

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ToolKnit Desktop ${{ inputs.tag || github.ref_name }}
          body_path: docs/desktop-update.md
          files: |
            toolknit-desktop/src-tauri/target/release/bundle/nsis/*.exe
            toolknit-desktop/src-tauri/target/release/bundle/nsis/*.exe.sha256
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
