name: Test signing

on:
  workflow_dispatch:
  push:
    branches:
      - 'ToolKnit-Desktop-V3.0-正式版'
    paths:
      - '.github/workflows/test-signing.yml'
      - 'toolknit-desktop/scripts/verify-test-signature.ps1'

permissions:
  contents: read
  actions: read

concurrency:
  group: test-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-signing:
    if: github.repository == 'ZihangDong/toolknit-desktop' && github.ref == 'refs/heads/ToolKnit-Desktop-V3.0-正式版'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: toolknit-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check signing credential is configured
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw 'Add the CI builds token as the SIGNPATH_API_TOKEN Actions secret, then rerun this workflow.'
          }

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolknit-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-31

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test signature verifier rejection paths
        run: ./scripts/test-signpath-verifier.ps1

      - name: Prepare locked FFmpeg for native integration tests
        run: |
          $directory = Join-Path $PWD 'src-tauri/resources/ffmpeg'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-win32-x64.gz'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz' -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $expectedHash = '8883a3dffbd0a16cf4ef95206ea05283f78908dbfb118f73c83f4951dcc06d77'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'FFmpeg archive integrity check failed.'
          }
          $inputStream = [IO.File]::OpenRead($archive)
          try {
            $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
            try {
              $outputStream = [IO.File]::Create((Join-Path $directory 'ffmpeg.exe'))
              try { $gzipStream.CopyTo($outputStream) } finally { $outputStream.Dispose() }
            } finally { $gzipStream.Dispose() }
          } finally { $inputStream.Dispose() }

      - name: Run complete release test suite
        run: npm run test:release

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Build production-configured NSIS installer
        run: npm run tauri -- build --bundles nsis -- --locked

      - name: Prepare unsigned test artifact
        id: installer
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one newly built NSIS installer.' }
          if ((Get-AuthenticodeSignature -LiteralPath $installers[0].FullName).Status -ne 'NotSigned') {
            throw 'Test signing expects an unsigned input.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $directory = Join-Path $PWD 'tmp/signpath/unsigned'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $path = Join-Path $directory "ToolKnit-Desktop-$version-TestSigning-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $path
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer with GitHub provenance
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Submit test signing request
        id: signpath
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 370ceefa-c61a-442a-902b-60a5a867f059
          project-slug: toolknit-desktop
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: toolknit-desktop/tmp/signpath/signed

      - name: Verify signed installer and record provenance
        env:
          UNSIGNED_INSTALLER: ${{ steps.installer.outputs.path }}
          SIGNING_REQUEST_ID: ${{ steps.signpath.outputs.signing-request-id }}
          SIGNING_REQUEST_URL: ${{ steps.signpath.outputs.signing-request-web-url }}
          SIGNPATH_TEST_CERTIFICATE_THUMBPRINT: '6831FA4A3067EDCE07AD33005E16AD0997662B05'
        run: |
          $installers = @(Get-ChildItem 'tmp/signpath/signed/*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed installer.' }
          ./scripts/verify-test-signature.ps1 -SignedPath $installers[0].FullName -UnsignedPath $env:UNSIGNED_INSTALLER -ExpectedThumbprint $env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT -ReportPath 'tmp/signpath/signed/verification.json'
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -LiteralPath "$($installers[0].FullName).sha256" -Encoding ascii
          [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            workflowRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            signingRequestId = $env:SIGNING_REQUEST_ID
            signingRequestUrl = $env:SIGNING_REQUEST_URL
            policy = 'test-signing'
            coverage = 'Outer NSIS installer only; embedded executables are not signed by this workflow.'
            productionRelease = $false
          } | ConvertTo-Json | Set-Content 'tmp/signpath/signed/provenance.json' -Encoding utf8
          @(
            '## Test signing completed'
            'Test certificate only. This installer is not a publicly trusted production release.'
            "Source commit: $env:GITHUB_SHA"
            "Signing request: $env:SIGNING_REQUEST_URL"
            "SHA-256: $hash"
            'Coverage: outer NSIS installer only.'
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Upload verified test-signed installer and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolknit-test-signed-${{ github.run_id }}
          path: toolknit-desktop/tmp/signpath/signed/*
          if-no-files-found: error
          retention-days: 14
