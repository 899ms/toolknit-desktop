<div class="api-key-overlay" id="apiKeyOverlay">
      <div class="api-key-header">
        <button class="api-key-back" id="apiKeyBack" data-i18n-title="settings.back">
          <div class="svg-wrapper-1">
            <div class="svg-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" class="icon">
                <path d="M19 12H5M12 19l-7-7 7-7"></path>
              </svg>
            </div>
          </div>
          <span data-i18n="settings.back">返回</span>
        </button>
      </div>
      <div class="api-key-content">
        <div class="tk-mascot-lg" aria-hidden="true"></div>
        <div class="api-key-section">
          <h3 class="settings-section-title" data-i18n="apiKey.title">AI 平台密钥</h3>
          <div class="api-key-platform-wrap">
            <label class="api-key-label" data-i18n="apiKey.platform">AI 平台</label>
            <div class="api-key-dropdown" id="apiKeyDropdown">
              <div class="api-key-dropdown-trigger" id="apiKeyDropdownTrigger">
                <span class="api-key-dropdown-value" id="apiKeyDropdownValue">DeepSeek</span>
                <svg class="api-key-dropdown-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </div>
              <div class="api-key-dropdown-menu" id="apiKeyDropdownMenu">
                <div class="api-key-dropdown-item" data-value="deepseek">DeepSeek</div>
                <div class="api-key-dropdown-item" data-value="openai">OpenAI</div>
                <div class="api-key-dropdown-item" data-value="qwen">通义千问 (Qwen)</div>
                <div class="api-key-dropdown-item" data-value="moonshot">Moonshot (Kimi)</div>
                <div class="api-key-dropdown-item" data-value="custom" data-i18n="apiKey.custom">自定义</div>
              </div>
            </div>
          </div>
          <div class="api-key-input-wrap">
            <input type="password" class="api-key-input" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
            <button class="api-key-toggle" id="apiKeyToggle" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div class="api-key-custom-wrap" id="apiKeyCustomWrap" style="display:none;">
            <div class="api-key-custom-field">
              <label class="api-key-label" data-i18n="apiKey.customUrl">API 地址</label>
              <input type="text" class="api-key-input" id="apiKeyCustomUrl" placeholder="https://api.example.com/v1/chat/completions" autocomplete="off">
            </div>
            <div class="api-key-custom-field">
              <label class="api-key-label" data-i18n="apiKey.customModel">模型名称</label>
              <input type="text" class="api-key-input" id="apiKeyCustomModel" placeholder="model-name" autocomplete="off">
            </div>
            <div class="settings-toggle-row api-key-private-http-row">
              <div class="settings-toggle-copy">
                <strong data-i18n="apiKey.allowPrivateHttp">允许私网 HTTP</strong>
                <span data-i18n="apiKey.allowPrivateHttpHint">仅用于你信任的局域网 AI 服务</span>
              </div>
              <button class="settings-switch" id="apiKeyPrivateHttpSwitch" type="button" role="switch" aria-checked="false" data-i18n-aria-label="apiKey.allowPrivateHttp"><span></span></button>
            </div>
          </div>
          <div class="api-key-hint" data-i18n="apiKey.hint">用于 AI 功能。密钥仅保存在本地，不会上传服务器。</div>
          <div class="api-key-actions">
            <button class="api-key-btn api-key-btn-secondary" id="apiKeyClear" data-i18n="apiKey.clear">清除</button>
            <button class="api-key-btn api-key-btn-primary" id="apiKeySave" data-i18n="apiKey.save">保存</button>
          </div>
          <div class="api-key-status" id="apiKeyStatus"></div>
        </div>
      </div>
    </div>

<div class="ffmpeg-overlay" id="aiKeyRequiredOverlay">
      <div class="ffmpeg-overlay-bg" id="aiKeyRequiredOverlayBg"></div>
      <div class="ffmpeg-overlay-content">
        <div class="tk-mascot-lg" aria-hidden="true"></div>
        <h2 class="ffmpeg-overlay-title" data-i18n="home.aiKeyRequired.title">需要配置 AI 密钥</h2>
        <p class="ffmpeg-overlay-desc" data-i18n="home.aiKeyRequired.desc">请先在设置中配置 AI 平台密钥。密钥仅保存在本地。</p>
        <div class="ffmpeg-overlay-actions">
          <button class="ffmpeg-overlay-btn ffmpeg-overlay-cancel" id="aiKeyRequiredCancel" data-i18n="home.aiKeyRequired.cancel">取消</button>
          <button class="ffmpeg-overlay-btn ffmpeg-overlay-confirm" id="aiKeyRequiredGoSettings" data-i18n="home.aiKeyRequired.goSettings">去设置</button>
        </div>
      </div>
    </div>
